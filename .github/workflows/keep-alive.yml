name: Keep backend awake

# Pings the Render free-tier API every 10 minutes so it doesn't spin down from
# inactivity (cold start after sleeping is 30-50s). Also runnable by hand from
# the Actions tab a few minutes before a live demo, as a guaranteed wake-up.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 https://pc-builder-api-1b1i.onrender.com/api/health
