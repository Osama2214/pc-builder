<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Build a fully compatible custom PC or shop individual computer parts — PC Builder checks CPU, motherboard, RAM, and GPU compatibility before you buy." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PC Builder" />
  <meta property="og:description" content="Build a fully compatible custom PC or shop individual computer parts — PC Builder checks compatibility before you buy." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>PC Builder</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <section class="hero" id="hero">
    <div class="container hero-inner hidden" id="hero-text">
      <h1 id="hero-heading">Build Your Dream PC</h1>
      <p id="hero-subtext">Browse parts, build a compatible PC, and check out with confidence.</p>
      <div class="hero-actions">
        <a href="products.html" class="btn btn-auto">Shop Now</a>
        <a href="build.html" class="btn btn-secondary btn-auto">Build a PC</a>
      </div>
    </div>

    <div class="hero-carousel hidden" id="hero-carousel">
      <div class="hero-carousel-track" id="hero-carousel-track"></div>
      <button type="button" class="hero-carousel-nav hero-carousel-prev hidden" id="hero-prev" aria-label="Previous slide">‹</button>
      <button type="button" class="hero-carousel-nav hero-carousel-next hidden" id="hero-next" aria-label="Next slide">›</button>
      <div class="hero-carousel-dots" id="hero-dots"></div>
    </div>
  </section>

  <div class="page" style="padding-top: 40px;">
    <div class="container">
      <div class="home-section hidden" id="home-deals-section">
        <div class="page-header">
          <h2>Deals &amp; Offers</h2>
          <a href="products.html">View all</a>
        </div>
        <div id="home-deals" class="product-grid"></div>
      </div>

      <div class="home-section hidden" id="home-latest-section">
        <div class="page-header">
          <h2>Latest Products</h2>
          <a href="products.html">View all</a>
        </div>
        <div id="home-latest" class="product-grid"></div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/bg-icons.js"></script>
  <script src="js/cart-drawer.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/custom-select.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/product-card.js"></script>
  <script>
    const user = Auth.getUser();
    if (Auth.isLoggedIn() && user) {
      document.getElementById("hero-heading").textContent = `Welcome back, ${user.name}`;
    }

    async function loadHomeProducts() {
      try {
        const result = await apiRequest("/products", { auth: false });
        const products = result.data;

        const deals = products.filter((p) => p.sale_price && Number(p.sale_price) < Number(p.price)).slice(0, 8);
        if (deals.length > 0) {
          document.getElementById("home-deals").innerHTML = deals.map(renderProductCard).join("");
          document.getElementById("home-deals-section").classList.remove("hidden");
        }

        const latest = products.slice(0, 8);
        if (latest.length > 0) {
          document.getElementById("home-latest").innerHTML = latest.map(renderProductCard).join("");
          document.getElementById("home-latest-section").classList.remove("hidden");
        }
      } catch (error) {
        // Homepage sections are a nice-to-have; nav/hero still work without them.
      }
    }

    let heroSlides = [];
    // Position in the rendered track, which — when there's more than one slide —
    // has a clone of the last slide prepended and a clone of the first slide
    // appended (real slide i lives at position i+1). That lets next/prev/autoplay
    // always step one position in the same direction; once the clone at either
    // end is reached, a timer (see HERO_TRANSITION_MS below) snaps back to the
    // matching real slide with the transition disabled, so the loop keeps sliding
    // forward (or backward) instead of visibly rewinding to slide 1 every 5 seconds.
    let heroTrackPosition = 0;
    let heroSnapTimer = null;
    // Must match .hero-carousel-track's CSS transition duration (plus a small
    // buffer) — a setTimeout rather than a `transitionend` listener, since
    // transitionend doesn't reliably fire for a backgrounded/non-visible tab.
    const HERO_TRANSITION_MS = 450;

    async function loadHeroBanners() {
      try {
        const result = await apiRequest("/banners", { auth: false });
        heroSlides = result.data;
      } catch (error) {
        heroSlides = [];
      }

      if (heroSlides.length === 0) {
        document.getElementById("hero-text").classList.remove("hidden");
        const heroEl = document.getElementById("hero");
        heroEl.classList.add("bg-icons-host");
        injectBgIcons(heroEl, HERO_BG_ICON_LAYOUT);
        return;
      }

      document.getElementById("hero").classList.add("hero-has-carousel");
      const carousel = document.getElementById("hero-carousel");
      carousel.classList.remove("hidden");

      const renderSlide = (slide) => {
        const img = `<img src="${escapeHtml(slide.image_url)}" alt="" />`;
        return `<div class="hero-carousel-slide">${slide.link_url ? `<a href="${escapeHtml(slide.link_url)}">${img}</a>` : img}</div>`;
      };

      const track = document.getElementById("hero-carousel-track");
      const loopable = heroSlides.length > 1;
      track.innerHTML = loopable
        ? [heroSlides[heroSlides.length - 1], ...heroSlides, heroSlides[0]].map(renderSlide).join("")
        : heroSlides.map(renderSlide).join("");

      if (loopable) {
        document.getElementById("hero-prev").classList.remove("hidden");
        document.getElementById("hero-next").classList.remove("hidden");

        const dotsEl = document.getElementById("hero-dots");
        dotsEl.innerHTML = heroSlides
          .map((_, i) => `<button type="button" class="hero-carousel-dot" data-index="${i}"></button>`)
          .join("");
        dotsEl.querySelectorAll(".hero-carousel-dot").forEach((dot) => {
          dot.addEventListener("click", () => goToHeroSlide(Number(dot.dataset.index)));
        });

        setInterval(() => stepHeroSlide(1), 5000);
      }

      setHeroTrackPosition(loopable ? 1 : 0, false);
    }

    function setHeroTrackPosition(position, animate) {
      const track = document.getElementById("hero-carousel-track");
      clearTimeout(heroSnapTimer);

      if (!animate) {
        track.style.transition = "none";
      }
      track.style.transform = `translateX(-${position * 100}%)`;
      heroTrackPosition = position;

      if (!animate) {
        track.getBoundingClientRect(); // force a reflow before re-enabling the transition
        track.style.transition = "";
      } else if (position === 0 || position === heroSlides.length + 1) {
        // Landed on a clone — once its (animated) slide-in finishes, snap back to
        // the matching real slide with the transition disabled. The clone is
        // visually identical to that real slide, so this reads as an uninterrupted
        // loop instead of a jump.
        heroSnapTimer = setTimeout(() => {
          setHeroTrackPosition(position === 0 ? heroSlides.length : 1, false);
        }, HERO_TRANSITION_MS);
      }

      const realIndex = (((position - 1) % heroSlides.length) + heroSlides.length) % heroSlides.length;
      document
        .querySelectorAll(".hero-carousel-dot")
        .forEach((dot, i) => dot.classList.toggle("active", i === realIndex));
    }

    function stepHeroSlide(delta) {
      if (heroSlides.length <= 1) return;

      // If a previous step landed on a clone and its snap-back timer hasn't fired
      // yet (e.g. two clicks within the transition duration), correct the
      // position instantly first so this step never overshoots the track.
      if (heroTrackPosition === 0) {
        setHeroTrackPosition(heroSlides.length, false);
      } else if (heroTrackPosition === heroSlides.length + 1) {
        setHeroTrackPosition(1, false);
      }

      setHeroTrackPosition(heroTrackPosition + delta, true);
    }

    function goToHeroSlide(realIndex) {
      setHeroTrackPosition(realIndex + 1, true);
    }

    document.getElementById("hero-prev").addEventListener("click", () => stepHeroSlide(-1));
    document.getElementById("hero-next").addEventListener("click", () => stepHeroSlide(1));

    loadHeroBanners();
    loadHomeProducts();
  </script>
</body>
</html>
