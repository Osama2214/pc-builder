<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Set the saved theme before first paint so returning users with "light"
    // saved don't see a flash of the dark theme while nav.js loads (id: no-theme-flash).
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
  </script>
  <meta name="description" content="View the PC parts you've saved for later on PC Builder." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Wishlist — PC Builder</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page">
    <div class="container">
      <div class="page-header">
        <h1>Wishlist</h1>
      </div>

      <div id="state" class="state-message">Loading your wishlist...</div>
      <div id="grid" class="product-grid"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart-drawer.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/custom-select.js"></script>
  <script src="js/toast.js"></script>
  <script>
    Auth.requireAuth();

    const stateEl = document.getElementById("state");
    const gridEl = document.getElementById("grid");

    async function loadWishlist() {
      try {
        const result = await apiRequest("/wishlist");
        render(result.data);
      } catch (error) {
        stateEl.textContent = error.message || "Could not load your wishlist.";
      }
    }

    function render(items) {
      if (items.length === 0) {
        gridEl.innerHTML = "";
        stateEl.classList.remove("hidden");
        stateEl.innerHTML = emptyStateHtml("Your wishlist is empty. Browse products and save some for later.");
        return;
      }

      stateEl.classList.add("hidden");
      gridEl.innerHTML = items.map(renderWishlistCard).join("");

      items.forEach((item) => {
        document.getElementById(`remove-${item.product.id}`).addEventListener("click", (e) => {
          e.preventDefault();
          removeFromWishlist(item.product.id);
        });
        const addBtn = document.getElementById(`add-cart-${item.product.id}`);
        if (addBtn) {
          addBtn.addEventListener("click", (e) => {
            e.preventDefault();
            addToCart(item.product.id, addBtn);
          });
        }
      });
    }

    function renderWishlistCard(item) {
      const product = item.product;
      const price = product.sale_price ?? product.price;
      const thumb = getProductThumbHtml(product);

      return `
        <div class="product-card">
          <a class="product-card-link" href="product.html?id=${product.id}">
            <div class="product-thumb">${thumb}</div>
            <div class="product-card-body">
              <div class="product-card-name">${escapeHtml(product.name)}</div>
              <div>${product.in_stock ? '<span class="badge badge-success">In stock</span>' : '<span class="badge badge-danger">Out of stock</span>'}</div>
              <div class="product-card-price-row"><span class="price">${formatPrice(price)}</span></div>
            </div>
          </a>
          <div style="display:flex; gap:8px; padding: 0 16px 16px;">
            <button type="button" class="btn btn-auto" id="add-cart-${product.id}" ${!product.in_stock ? "disabled" : ""}>Add to Cart</button>
            <button type="button" class="cart-item-remove" id="remove-${product.id}">Remove</button>
          </div>
        </div>
      `;
    }

    async function removeFromWishlist(productId) {
      try {
        await apiRequest(`/wishlist/${productId}`, { method: "DELETE" });
        loadWishlist();
      } catch (error) {
        showToast(error.message || "Could not remove item.", "danger");
      }
    }

    async function addToCart(productId, button) {
      button.disabled = true;
      const original = button.textContent;
      button.textContent = "Adding...";
      try {
        await apiRequest("/cart/items", { method: "POST", body: { product_id: productId, quantity: 1 } });
        button.textContent = "Added!";
        refreshCartBadge();
        openCartDrawer();
      } catch (error) {
        button.textContent = original;
        button.disabled = false;
        showToast(error.message || "Could not add to cart.", "danger");
      }
    }

    loadWishlist();
  </script>
</body>
</html>
