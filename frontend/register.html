<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
  </script>
  <meta name="description" content="Create a free PC Builder account to build, compare, and buy compatible PC parts." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Register — PC Builder</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="auth-header">
    <div class="container auth-header-inner">
      <a href="index.html" class="brand">PC Builder</a>
      <div id="theme-toggle-container"></div>
    </div>
  </header>

  <div class="page-center bg-icons-host">
    <div class="card">
      <h1>Create your account</h1>
      <p class="card-subtitle">Build, compare, and buy compatible PC parts.</p>

      <form id="register-form" novalidate>
        <div class="alert alert-danger hidden"></div>

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
          <div class="field-error" data-error-for="name"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <div class="field-error" data-error-for="email"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <div class="field-error" data-error-for="password"></div>
        </div>

        <div class="field">
          <label for="password_confirmation">Confirm password</label>
          <input type="password" id="password_confirmation" name="password_confirmation" autocomplete="new-password" required />
          <div class="field-error" data-error-for="password_confirmation"></div>
        </div>

        <button type="submit" class="btn" id="register-submit">Create account</button>
      </form>

      <div class="form-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/form-helpers.js"></script>
  <script src="js/bg-icons.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.redirectIfAuthenticated("index.html");

    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("register-submit");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearFormErrors(form);
      setButtonLoading(submitBtn, true, "Creating account...");

      try {
        const result = await Api.register({
          name: form.name.value,
          email: form.email.value,
          password: form.password.value,
          password_confirmation: form.password_confirmation.value,
        });

        Auth.saveSession(result.token, result.user);
        window.location.href = "index.html";
      } catch (error) {
        displayFormErrors(form, error);
      } finally {
        setButtonLoading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
