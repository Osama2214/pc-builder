<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Admin: Reviews — PC Builder</title>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page">
    <div class="container" style="max-width: 800px;">
      <div class="page-header">
        <div>
          <a href="index.html" class="link-btn" style="display: inline-block; margin-bottom: 10px;">← Back to Dashboard</a>
          <h1>Pending Reviews</h1>
        </div>
      </div>

      <div id="state" class="state-message">Loading...</div>
      <div id="list"></div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/cart-drawer.js"></script>
  <script src="../js/ai-chat.js"></script>
  <script src="../js/custom-select.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/confirm-dialog.js"></script>
  <script>
    Auth.requireAdmin();

    const stateEl = document.getElementById("state");
    const listEl = document.getElementById("list");

    async function load() {
      try {
        const result = await apiRequest("/reviews/pending");
        render(result.data);
      } catch (error) {
        stateEl.textContent = error.message || "Could not load pending reviews.";
      }
    }

    function render(reviews) {
      stateEl.classList.toggle("hidden", reviews.length > 0);
      if (reviews.length === 0) {
        stateEl.innerHTML = emptyStateHtml("No pending reviews. All caught up!");
        listEl.innerHTML = "";
        return;
      }

      listEl.innerHTML = reviews.map(
        (review) => `
          <div class="section-card" style="margin-top:0; margin-bottom:16px;">
            <div class="review-header">
              <span class="review-author">${escapeHtml(review.user.name)}</span>
              <span class="review-rating">${"★".repeat(review.rating)}${"☆".repeat(5 - review.rating)}</span>
              <a href="/product.html?id=${review.product_id}" style="margin-left:auto; font-size:0.82rem;">View product</a>
            </div>
            ${review.comment ? `<p class="review-comment">${escapeHtml(review.comment)}</p>` : ""}
            <div style="display:flex; gap:10px; margin-top:10px;">
              <button type="button" class="btn btn-auto" id="approve-${review.id}">Approve</button>
              <button type="button" class="cart-item-remove" id="reject-${review.id}">Reject &amp; delete</button>
            </div>
          </div>
        `
      ).join("");

      reviews.forEach((review) => {
        document.getElementById(`approve-${review.id}`).addEventListener("click", () => approve(review.id));
        document.getElementById(`reject-${review.id}`).addEventListener("click", () => reject(review.id));
      });
    }

    async function approve(id) {
      try {
        await apiRequest(`/reviews/${id}/approve`, { method: "PATCH" });
        load();
      } catch (error) {
        showToast(error.message || "Could not approve this review.", "danger");
      }
    }

    async function reject(id) {
      if (!(await showConfirm("Delete this review permanently?"))) return;
      try {
        await apiRequest(`/reviews/${id}`, { method: "DELETE" });
        load();
      } catch (error) {
        showToast(error.message || "Could not delete this review.", "danger");
      }
    }

    load();
  </script>
</body>
</html>
